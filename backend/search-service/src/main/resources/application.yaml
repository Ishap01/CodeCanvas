server:
  port: 8083

spring:
  application:
    name: search-service

  datasource:
    url: jdbc:postgresql://localhost:5432/codecanvas
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  elasticsearch:
    uris: http://localhost:9200

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

