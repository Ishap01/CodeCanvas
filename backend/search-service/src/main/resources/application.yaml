server:
  port: 8083

spring:
  application:
    name: search-service

  datasource:
    url: jdbc:postgresql://localhost:5432/codecanvas
    username: postgres
    password: Yash@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
      bootstrap-servers: localhost:9092

      consumer:
        group-id: search-service
        auto-offset-reset: earliest

  elasticsearch:
    uris: http://localhost:9200

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000
      use-key-prefix: true
      key-prefix: "search-service::"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

