server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/codecanvas
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
            logger-level: basic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

razorpay:
  key-id: rzp_test_TJoxqhkx81Tjcg
  key-secret: P0uGFcG0VFDAA5kBz3F4LgV0
  webhook-secret: codecanvasWebhookSecret2026

jwt:
  # IMPORTANT:
  # User Service wala EXACT same JWT secret yaha paste karo
  secret: YOUR_USER_SERVICE_JWT_SECRET

payment:
  premium-plan:
    amount: 499.00

  scheduler:
    pending-expiry-minutes: 30
    fixed-delay-milliseconds: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.codecanvas.paymentservice: DEBUG
    org.springframework.security: INFO
    feign: INFO