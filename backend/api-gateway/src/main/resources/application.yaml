server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: user-service-statistics
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/statistics/**

            - id: user-service-subscriptions
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/subscriptions/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/ai/**

            - id: snippet-service
              uri: lb://SNIPPET-SERVICE
              predicates:
                - Path=/api/snippets/**


            - id: snippet-service-comments
              uri: lb://SNIPPET-SERVICE
              predicates:
                - Path=/api/comments/**

            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/api/search/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}