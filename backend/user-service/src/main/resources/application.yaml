server:
  port: 8081

spring:
  application:
    name: user-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000
      use-key-prefix: true
      key-prefix: "user-service::"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest

subscription:
  plans:
    free:
      tier: FREE
      maxSnippetsPerMonth: 20
      aiRequestsPerMonth: 5
    basicPremium:
      tier: BASIC_PREMIUM
      maxSnippetsPerMonth: 100
      aiRequestsPerMonth: 100
    proPremium:
      tier: PRO_PREMIUM
      maxSnippetsPerMonth: 1000
      aiRequestsPerMonth: 1000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: INFO


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

